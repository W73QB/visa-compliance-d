<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
{{- $vfcss := resources.Get "css/visafact.css" | resources.Minify | fingerprint -}}
<link rel="stylesheet" href="{{ $vfcss.RelPermalink }}" integrity="{{ $vfcss.Data.Integrity }}" crossorigin="anonymous" />
<link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}" />
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>
  (function () {
    try {
      var region = localStorage.getItem("vf_region");
      var path = location.pathname || "";
      if (region && (path === "/affiliate-disclosure/" || path === "/affiliate-disclosure")) {
        location.replace("/legal/" + region + "/affiliate-disclosure/");
      }
    } catch (e) {
      // no-op
    }
  })();

  function vf_analytics_allowed() {
    try {
      var region = localStorage.getItem("vf_region");
      if (region === "eu-uk") {
        return localStorage.getItem("vf_cookie_consent") === "1";
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  window.addEventListener("load", function () {
    try {
      var region = localStorage.getItem("vf_region");
      var banner = document.getElementById("vf-cookie-banner");
      var accept = document.getElementById("vf-cookie-accept");
      if (!banner || !accept) return;
      if (region === "eu-uk" && localStorage.getItem("vf_cookie_consent") !== "1") {
        banner.style.display = "block";
      }
      accept.addEventListener("click", function () {
        localStorage.setItem("vf_cookie_consent", "1");
        banner.style.display = "none";
      });
    } catch (e) {
      // no-op
    }
  });
</script>
