name: Deploy Hugo site

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release snapshot id (e.g., 2026-01-12)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: pip install jsonschema pyyaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build CSS (Tailwind)
        run: |
          pnpm install --frozen-lockfile
          pnpm dlx update-browserslist-db@latest
          pnpm run build:css

      - name: Validate + build mappings + build index + snapshot + sync static
        run: |
          SNAPSHOT_ID=$(date -u +%F)
          export SNAPSHOT_ID
          python tools/validate.py
          python tools/build_content_hubs.py
          python tools/build_mappings.py
          python tools/build_index.py
          python tools/build_snapshot.py
          python tools/sync_hugo_static.py

      - name: Build release snapshot (optional)
        if: ${{ inputs.release_id != '' }}
        run: |
          python tools/build_release_snapshot.py --release-id "${{ inputs.release_id }}"
          python tools/sync_hugo_static.py

      - name: Ensure py alias on Linux
        run: |
          mkdir -p .bin
          ln -s "$(command -v python)" .bin/py
          echo "$PWD/.bin" >> "$GITHUB_PATH"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Run tests
        run: |
          pwsh -File tools/tests/ui_compliance_tests.ps1
          pwsh -File tools/tests/validate_product_sources_tests.ps1
          pwsh -File tools/tests/snapshot_tests.ps1
          pwsh -File tools/tests/snapshot_routing_tests.ps1
          pwsh -File tools/tests/release_snapshot_tests.ps1
          pwsh -File tools/tests/verify_snapshot_manifest_tests.ps1
          pwsh -File tools/tests/mapping_status_distribution_tests.ps1
          pwsh -File tools/tests/offers_tests.ps1
          pwsh -File tools/tests/content_lint_tests.ps1
          pwsh -File tools/tests/seo_audit_tests.ps1
          pwsh -File tools/tests/internal_link_integrity_tests.ps1
          pwsh -File tools/tests/source_monitor_tests.ps1
          pwsh -File tools/tests/hugo_integration_tests.ps1
          pwsh -File tools/tests/sync_hugo_static_tests.ps1
          pwsh -File tools/tests/verify_static_bundle_tests.ps1
          pwsh -File tools/tests/headers_tests.ps1
          pwsh -File tools/tests/analytics_tests.ps1
          pwsh -File tools/tests/smoke_tests.ps1
          pwsh -File tools/tests/performance_tests.ps1
          pwsh -File tools/tests/daily_auto_blog_tests.ps1
          pwsh -File tools/tests/daily_auto_blog_workflow_tests.ps1
          pwsh -File tools/tests/daily_auto_blog_e2e_tests.ps1
          pwsh -File tools/tests/pages_workflow_gates_tests.ps1

      - name: Lint content
        run: python tools/lint_content.py

      - name: Check editorial targets
        run: python tools/check_editorial_targets.py

      - name: Run SEO audit gate
        run: python tools/seo_audit.py --config tools/seo_thresholds.json

      - name: Check internal links
        run: python tools/check_internal_links.py

      - name: Build Hugo (with log)
        run: pwsh -File tools/build_hugo.ps1

      - name: Verify Hugo build log
        run: pwsh -File tools/tests/hugo_build_log_tests.ps1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Upload Hugo build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-log
          path: tools/logs/hugo-build.log

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          set -euo pipefail
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$response" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'; then
            echo "Purge OK"
          else
            echo "Purge failed: $response" && exit 1
          fi

  post_deploy_smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read baseURL from hugo.toml
        id: baseurl
        run: |
          BASE_URL=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path("hugo.toml").read_text())
          print(data["baseURL"].rstrip("/"))
          PY
          )
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke HTTP (retry)
        shell: pwsh
        run: |
          $baseUrl = '${{ steps.baseurl.outputs.base_url }}'
          $maxAttempts = 3
          $delaySec = 20
          $ok = $false
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Smoke attempt $i/$maxAttempts..."
            & ./tools/smoke_http.ps1 -BaseUrl $baseUrl
            if ($?) { $ok = $true; break }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds $delaySec }
          }
          if (-not $ok) { exit 1 }
